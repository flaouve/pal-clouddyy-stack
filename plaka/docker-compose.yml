services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    container_name: planka-app
    user: "0:0"
    restart: unless-stopped
    volumes:
      - planka_data:/app/data:Z
    environment:
      - BASE_URL=${PLANKA_BASE_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${PLANKA_DB_USER:-postgres}:${PLANKA_DB_PASS:-secretpassword}@planka-db:5432/${PLANKA_DB_NAME:-planka}
      - SECRET_KEY=${PLANKA_SECRET_KEY:-super_secret_key_planka}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@demo.local}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-adminpass123}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Admin}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
    depends_on:
      planka-db:
        condition: service_healthy
    networks:
      cloud_internal:
        aliases:
          - planka
    security_opt:
      - "label=disable"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  planka-db:
    image: docker.io/library/postgres:16-alpine
    container_name: planka-db
    user: "0:0"
    restart: unless-stopped
    volumes:
      - planka_db_data:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_DB=${PLANKA_DB_NAME:-planka}
      - POSTGRES_USER=${PLANKA_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${PLANKA_DB_PASS:-secretpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLANKA_DB_USER:-postgres} -d ${PLANKA_DB_NAME:-planka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

volumes:
  planka_data:
  planka_db_data:

networks:
  cloud_internal:
    external: true
