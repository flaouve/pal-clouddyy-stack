version: '3.8'

services:
  gitlab-runner:
    image: docker.io/gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    user: "0:0"
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - ${PODMAN_SOCK_PATH}:/var/run/docker.sock:Z
      - ./gitlabrunner/config.toml:/etc/gitlab-runner/config.toml:Z
    networks:
      cloud_internal:
        aliases:
          - gitlab-runner
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

networks:
  cloud_internal:
    external: true
