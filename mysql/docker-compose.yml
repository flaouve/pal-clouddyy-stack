services:
  mysql:
    image: docker.io/library/mysql:8.4
    container_name: mysql-server
    user: "0:0"
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-apppassword}
      - TZ=${MYSQL_TZ:-Europe/Istanbul}
    volumes:
      - mysql_data:/var/lib/mysql:Z
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      cloud_internal:
        aliases:
          - mysql
    security_opt:
      - "label=disable"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.20"
          memory: 256M

volumes:
  mysql_data:

networks:
  cloud_internal:
    external: true
